<header>
    <nav id="navbar">
        <i class="fa-solid fa-burger" id="nav_logo">FOOD</i>
        <ul id="nav_list">
            <li class="nav-item active">
                <a href="#home">Início</a>
            </li>
            <li class="nav-item">
                <a href="#menu">Cardápio</a>
            </li>
            <li class="nav-item">
                <a href="#testimonials">Avaliações</a>
            </li>
        </ul>

        <app-button-default class="btn-default"></app-button-default>

   
        <button id="mobile_btn" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-label="Abrir menu">
            <i class="fas fa-solid" [class.fa-bars]="!isMenuOpen" [class.fa-x]="isMenuOpen"></i>
        </button>

    </nav>

    <div id="mobile_menu" [class.open]="isMenuOpen">

        <ul id="mobile_nav_list">
            <li class="nav-item">
                <a href="#home" (click)="closeMenu()">Início</a>
            </li>
            <li class="nav-item">
                <a href="#menu" (click)="closeMenu()">Cardápio</a>
            </li>
            <li class="nav-item">
                <a href="#testimonials" (click)="closeMenu()">Avaliações</a>
            </li>
        </ul>

        <app-button-default class="btn-default"></app-button-default>
    </div>

</header>
